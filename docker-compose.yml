services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codemuscle
      POSTGRES_USER: codemuscle
      POSTGRES_PASSWORD: codemuscle
    ports: ["5432:5432"]
    volumes: [codemuscle_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U codemuscle -d codemuscle"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: {context: ., dockerfile: infrastructure/api.Dockerfile}
    environment:
      DATABASE_URL: postgresql://codemuscle:codemuscle@postgres:5432/codemuscle
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: infrastructure/web.Dockerfile
      args: {NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1}
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  codemuscle_postgres:
