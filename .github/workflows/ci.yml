name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codemuscle
          POSTGRES_USER: codemuscle
          POSTGRES_PASSWORD: codemuscle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codemuscle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://codemuscle:codemuscle@localhost:5432/codemuscle
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @codemuscle/training-content generate
      - run: pnpm --filter @codemuscle/api exec prisma generate
      - run: pnpm --filter @codemuscle/api exec prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate:training-projects
