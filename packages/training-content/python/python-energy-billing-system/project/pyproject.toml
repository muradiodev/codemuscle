[project]
name = "python-energy-billing-system"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
