services:
  api:
    image: registry.hubpoint.ai/codemuscle/api:dev-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DEPLOY_DATABASE_URL}
      API_PORT: 4000
      WEB_ORIGIN: https://codemuscle.deviofy.com
      NODE_ENV: production
      AUTH_COOKIE_DOMAIN: .deviofy.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4010:4000"

  web:
    image: registry.hubpoint.ai/codemuscle/web:dev-latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3010:3000"
